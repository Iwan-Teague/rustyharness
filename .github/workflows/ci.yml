name: ci

on:
  push:
  pull_request:

# Least privilege (suite AQ-97): read-only token; no job publishes or writes.
permissions:
  contents: read

jobs:
  gates:
    # Portability is a design driver: every gate runs on all three OSes.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny --version 0.20.2
      - name: Supply-chain check (advisories, bans, sources)
        run: cargo deny check advisories bans sources
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
