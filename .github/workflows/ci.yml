name: ci

on:
  push:
  pull_request:

# Least privilege (suite AQ-97): read-only token; no job publishes or writes.
permissions:
  contents: read

jobs:
  # The member gate entrypoint itself, exactly as tooling/dev-push.sh runs
  # it (scripts/ci/gates.sh): fmt, the purity gate and its refusal
  # witnesses, cargo-deny, clippy and tests over the workspace, clippy and
  # tests of gate-outcome alone (the only build without gate-outcome/json:
  # harness-cli enables it, so every workspace build has it), and the
  # compile-fail doctests with their error codes. The purity gate reads
  # `cargo tree --target all`, so the dependency shape of every target,
  # Windows included, is checked here.
  gates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny --version 0.20.2
      - name: Member gates (scripts/ci/gates.sh)
        run: sh scripts/ci/gates.sh

  # Windows runs every cargo step of the gates. The purity scripts are POSIX
  # sh and run in the job above; the compile-fail doctests check error codes,
  # which do not depend on the target.
  gates-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny --version 0.20.2
      - name: Supply-chain check (advisories, bans, licenses, sources)
        run: cargo deny check advisories bans licenses sources
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Clippy (gate-outcome alone, without json)
        run: cargo clippy --locked -p gate-outcome --all-targets -- -D warnings
      # --no-fail-fast: one failing test binary must not hide the others.
      - name: Test
        run: cargo test --locked --workspace --no-fail-fast
      # Runs even when the workspace tests failed, so its result is seen too.
      - name: Test (gate-outcome alone, without json)
        if: ${{ !cancelled() }}
        run: cargo test --locked -p gate-outcome --no-fail-fast
