[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
publish = false
# Source-available, noncommercial (docs/adr/0003-licence.md): free for any
# noncommercial use; commercial use needs a separate licence from the author.
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/Iwan-Teague/rustyharness"

[workspace.dependencies]
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0.100"
thiserror = "2.0.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
