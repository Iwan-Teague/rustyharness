# cargo-deny configuration — rustyharness.
# Gate: `cargo deny check advisories bans sources` (scripts/ci/gates.sh, CI).
# `licenses` is not gated pending the suite licence ruling (OI-05).

[graph]
all-features = true

[licenses]
version = 2
allow = ["Apache-2.0", "MIT", "Unicode-3.0"]
confidence-threshold = 1.0

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Intra-workspace path dependencies carry no version; they are not registry
# wildcards. Allowed only because every crate here is publish = false.
allow-wildcard-paths = true
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[advisories]
version = 2
yanked = "deny"
ignore = []
